---
layout: page
title: 구독 해지
permalink: /unsubscribe/
---

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div id="unsubscribe-card" class="card text-center">
        <div class="card-body py-5">
          <!-- Loading State -->
          <div id="unsub-loading">
            <div class="spinner-border text-primary mb-3" role="status">
              <span class="visually-hidden">처리 중...</span>
            </div>
            <h4>구독 해지를 처리하고 있습니다...</h4>
          </div>

          <!-- Confirm State (before unsubscribe) -->
          <div id="unsub-confirm" class="d-none">
            <div class="mb-4">
              <i class="fas fa-envelope-open text-warning" style="font-size: 4rem;"></i>
            </div>
            <h3 class="mb-3">정말 구독을 해지하시겠습니까?</h3>
            <p class="text-muted mb-4">
              구독을 해지하시면 더 이상 새 글 알림을 받지 못합니다.
            </p>
            <div class="d-flex justify-content-center gap-3">
              <button id="unsub-btn-confirm" class="btn btn-danger">
                <i class="fas fa-times me-1"></i>구독 해지
              </button>
              <a href="/" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i>취소
              </a>
            </div>
          </div>

          <!-- Success State -->
          <div id="unsub-success" class="d-none">
            <div class="mb-4">
              <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
            </div>
            <h3 class="mb-3">구독이 해지되었습니다</h3>
            <p class="text-muted mb-4">
              그동안 구독해 주셔서 감사합니다.<br>
              언제든 다시 구독하실 수 있습니다.
            </p>
            <a href="/" class="btn btn-primary">
              <i class="fas fa-home me-1"></i>블로그 홈으로
            </a>
          </div>

          <!-- Error State -->
          <div id="unsub-error" class="d-none">
            <div class="mb-4">
              <i class="fas fa-exclamation-circle text-danger" style="font-size: 4rem;"></i>
            </div>
            <h3 class="mb-3">처리 실패</h3>
            <p class="text-muted mb-4" id="unsub-error-message">
              유효하지 않거나 만료된 링크입니다.
            </p>
            <a href="/" class="btn btn-secondary">
              <i class="fas fa-home me-1"></i>블로그 홈으로
            </a>
          </div>

          <!-- No Token State -->
          <div id="unsub-notoken" class="d-none">
            <div class="mb-4">
              <i class="fas fa-question-circle text-warning" style="font-size: 4rem;"></i>
            </div>
            <h3 class="mb-3">잘못된 접근</h3>
            <p class="text-muted mb-4">
              이메일의 구독 해지 링크를 통해 접속해주세요.
            </p>
            <a href="/" class="btn btn-secondary">
              <i class="fas fa-home me-1"></i>블로그 홈으로
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
#unsubscribe-card {
  border: none;
  border-radius: 1rem;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
}

#unsubscribe-card .btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none;
  padding: 0.75rem 2rem;
}

#unsubscribe-card .btn-danger {
  padding: 0.75rem 2rem;
}
</style>

<script>
(function() {
  const NEWSLETTER_API_URL = 'https://newsletter-api.ounols.kr';

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  const loadingEl = document.getElementById('unsub-loading');
  const confirmEl = document.getElementById('unsub-confirm');
  const successEl = document.getElementById('unsub-success');
  const errorEl = document.getElementById('unsub-error');
  const notokenEl = document.getElementById('unsub-notoken');
  const errorMsgEl = document.getElementById('unsub-error-message');
  const confirmBtn = document.getElementById('unsub-btn-confirm');

  function showState(state) {
    loadingEl.classList.add('d-none');
    confirmEl.classList.add('d-none');
    successEl.classList.add('d-none');
    errorEl.classList.add('d-none');
    notokenEl.classList.add('d-none');

    state.classList.remove('d-none');
  }

  if (!token) {
    showState(notokenEl);
    return;
  }

  // Show confirmation dialog
  showState(confirmEl);

  // Handle unsubscribe
  confirmBtn.addEventListener('click', function() {
    confirmBtn.disabled = true;
    confirmBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>처리 중...';

    fetch(`${NEWSLETTER_API_URL}/api/unsubscribe/${token}`)
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          showState(successEl);
        } else {
          errorMsgEl.textContent = data.error || '처리에 실패했습니다.';
          showState(errorEl);
        }
      })
      .catch(error => {
        errorMsgEl.textContent = '네트워크 오류가 발생했습니다.';
        showState(errorEl);
      });
  });
})();
</script>
