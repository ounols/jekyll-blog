name: Weekly Newsletter

on:
  schedule:
    # 매주 화요일 오전 10시(KST)에 실행 (UTC 화요일 01:00)
    - cron: "0 1 * * 2"
  workflow_dispatch: # 수동 실행 가능
    inputs:
      force_send:
        description: "강제 발송 (새 글이 없어도 발송)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  BLOG_URL: "https://blog.ounols.kr"
  NEWSLETTER_API_URL: "https://newsletter-api.ounols.kr"

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get new posts from last week
        id: get-posts
        run: |
          # 지난 7일간 추가/수정된 포스트 찾기
          SINCE_DATE=$(date -d "7 days ago" +%Y-%m-%d)
          echo "Checking posts since: $SINCE_DATE"

          # Git log에서 최근 커밋된 포스트 파일들 찾기
          NEW_POSTS=$(git log --since="$SINCE_DATE" --name-only --pretty=format: -- "_posts/*.md" | sort -u | grep -v "^$" || true)

          if [ -z "$NEW_POSTS" ]; then
            echo "No new posts found"
            echo "has_posts=false" >> $GITHUB_OUTPUT
          else
            echo "Found new posts:"
            echo "$NEW_POSTS"
            echo "has_posts=true" >> $GITHUB_OUTPUT

            # 포스트 정보 추출
            POSTS_JSON="[]"
            while IFS= read -r post_file; do
              if [ -f "$post_file" ]; then
                # Front matter에서 제목 추출
                TITLE=$(sed -n '/^---$/,/^---$/p' "$post_file" | grep "^title:" | sed 's/^title: *//' | sed 's/^["'"'"']//' | sed 's/["'"'"']$//')

                # 파일명에서 날짜와 slug 추출
                FILENAME=$(basename "$post_file" .md)
                POST_DATE=$(echo "$FILENAME" | grep -oP '^\d{4}-\d{2}-\d{2}')
                POST_SLUG=$(echo "$FILENAME" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')

                # URL 생성
                POST_URL="${BLOG_URL}/posts/${POST_SLUG}/"

                # description 추출
                DESCRIPTION=$(sed -n '/^---$/,/^---$/p' "$post_file" | grep "^description:" | sed 's/^description: *//' | sed 's/^["'"'"']//' | sed 's/["'"'"']$//' | head -c 200)

                # JSON에 추가
                POSTS_JSON=$(echo "$POSTS_JSON" | jq --arg title "$TITLE" --arg url "$POST_URL" --arg desc "$DESCRIPTION" --arg date "$POST_DATE" '. + [{"title": $title, "url": $url, "description": $desc, "date": $date}]')
              fi
            done <<< "$NEW_POSTS"

            echo "posts_json<<EOF" >> $GITHUB_OUTPUT
            echo "$POSTS_JSON" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Check if should send
        id: check-send
        run: |
          if [ "${{ steps.get-posts.outputs.has_posts }}" == "true" ] || [ "${{ inputs.force_send }}" == "true" ]; then
            echo "should_send=true" >> $GITHUB_OUTPUT
          else
            echo "should_send=false" >> $GITHUB_OUTPUT
            echo "No new posts and force_send is false. Skipping newsletter."
          fi

      - name: Send newsletter
        if: steps.check-send.outputs.should_send == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # 구독자 목록 가져오기
          echo "Fetching subscribers..."
          SUBSCRIBERS=$(curl -s -X GET "$NEWSLETTER_API_URL/api/admin/subscribers" \
            -H "Authorization: Bearer $NEWSLETTER_API_KEY" \
            -H "Content-Type: application/json")

          SUBSCRIBER_COUNT=$(echo "$SUBSCRIBERS" | jq '.subscribers | length')
          echo "Found $SUBSCRIBER_COUNT confirmed subscribers"

          if [ "$SUBSCRIBER_COUNT" -eq 0 ]; then
            echo "No subscribers to send to. Exiting."
            exit 0
          fi

          # 뉴스레터 HTML 생성
          POSTS_JSON='${{ steps.get-posts.outputs.posts_json }}'
          TODAY=$(date +%Y년\ %m월\ %d일)
          WEEK_NUM=$(date +%V)

          # 포스트 목록 HTML 생성
          POSTS_HTML=""
          if [ -n "$POSTS_JSON" ] && [ "$POSTS_JSON" != "[]" ]; then
            POSTS_HTML=$(echo "$POSTS_JSON" | jq -r '.[] | "<div style=\"margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px;\"><h3 style=\"margin: 0 0 10px 0;\"><a href=\"\(.url)\" style=\"color: #667eea; text-decoration: none;\">\(.title)</a></h3><p style=\"color: #666; margin: 0; font-size: 14px;\">\(.description)</p><p style=\"color: #999; margin: 10px 0 0 0; font-size: 12px;\">📅 \(.date)</p></div>"' | tr '\n' ' ')
          else
            POSTS_HTML="<p>이번 주에는 새로운 글이 없습니다. 하지만 블로그에서 다양한 기술 글을 확인해보세요!</p>"
          fi

          # 각 구독자에게 이메일 발송
          echo "$SUBSCRIBERS" | jq -c '.subscribers[]' | while read subscriber; do
            EMAIL=$(echo "$subscriber" | jq -r '.email')
            NAME=$(echo "$subscriber" | jq -r '.name // ""')
            SUB_ID=$(echo "$subscriber" | jq -r '.id')

            GREETING="안녕하세요"
            if [ -n "$NAME" ] && [ "$NAME" != "null" ]; then
              GREETING="안녕하세요, ${NAME}님"
            fi

            # 이메일 HTML
            EMAIL_HTML=$(cat <<EMAILEOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
          </head>
          <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; border-radius: 10px 10px 0 0; text-align: center;">
              <h1 style="color: white; margin: 0; font-size: 24px;">@Ounols 블로그</h1>
              <p style="color: rgba(255,255,255,0.9); margin: 10px 0 0 0;">주간 뉴스레터 - ${TODAY}</p>
            </div>
            <div style="background: #ffffff; padding: 30px; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 10px 10px;">
              <p>${GREETING}!</p>
              <p>이번 주 @Ounols 블로그의 새로운 소식을 전해드립니다.</p>

              <h2 style="color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; margin-top: 30px;">이번 주의 글</h2>
              ${POSTS_HTML}

              <div style="text-align: center; margin: 30px 0;">
                <a href="${BLOG_URL}" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">블로그 방문하기</a>
              </div>

              <hr style="border: none; border-top: 1px solid #ddd; margin: 30px 0;">

              <p style="color: #999; font-size: 12px; text-align: center;">
                이 이메일은 ${EMAIL}으로 발송되었습니다.<br>
                <a href="${BLOG_URL}/unsubscribe/?token=UNSUBSCRIBE_TOKEN" style="color: #667eea;">구독 해지</a> |
                <a href="${BLOG_URL}/feeds/" style="color: #667eea;">RSS 피드</a>
              </p>
            </div>
          </body>
          </html>
          EMAILEOF
          )

            # Resend API로 이메일 발송
            echo "Sending to: $EMAIL"
            RESPONSE=$(curl -s -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"from\": \"Ounols Blog <newsletter@ounols.kr>\",
                \"to\": [\"$EMAIL\"],
                \"subject\": \"[@Ounols 블로그] 주간 뉴스레터 - ${TODAY}\",
                \"html\": $(echo "$EMAIL_HTML" | jq -Rs .)
              }")

            if echo "$RESPONSE" | jq -e '.id' > /dev/null 2>&1; then
              echo "✅ Sent successfully to $EMAIL"
            else
              echo "❌ Failed to send to $EMAIL: $RESPONSE"
            fi

            # Rate limiting
            sleep 0.5
          done

          echo "Newsletter sending completed!"

      - name: Summary
        run: |
          echo "## Newsletter Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-send.outputs.should_send }}" == "true" ]; then
            echo "✅ Newsletter was sent" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Posts included:" >> $GITHUB_STEP_SUMMARY
            echo '${{ steps.get-posts.outputs.posts_json }}' | jq -r '.[] | "- [\(.title)](\(.url))"' >> $GITHUB_STEP_SUMMARY || echo "- No posts data available" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Newsletter was skipped (no new posts)" >> $GITHUB_STEP_SUMMARY
          fi
