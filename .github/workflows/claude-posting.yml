name: Claude Posting Workflow

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'The target URL to process'
        required: true
        type: string
      author_opinion:
        description: 'Blog author opinion/thoughts on this topic (optional)'
        required: false
        type: string
      additional_prompt:
        description: 'Any additional prompt instructions'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  create-trending-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Jekyll blog repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: Setup GitHub CLI authentication
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Generate Blog Post with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read `post-template/url-posting-config.md` first for the complete workflow guide.
            Follow all template files in the order specified in the guide.

            TARGET_URL: `${{ inputs.target_url }}`
            AUTHOR_OPINION: ${{ inputs.author_opinion }}
            ADDITIONAL_PROMPT: ${{ inputs.additional_prompt }}

            Execute the workflow as specified in the template files.

            IMPORTANT: At the end of execution, provide ONLY a concise final summary in this exact format:

            ## Final Summary
            - Post Title: [제목]
            - File Created: [파일 경로]
            - PR Link: [PR URL]
            - Status: [Success/Failed]
            - Errors: [에러가 있다면 간단히 설명, 없으면 None]

          claude_args: '--allowed-tools "Bash(./import.sh:*)" --allowed-tools "Bash(git:*)" --allowed-tools "Bash(gh:*)" --allowed-tools "Bash(mkdir:*)" --allowed-tools "Bash(python:*)" --allowed-tools "Bash(python3:*)" --allowed-tools "Bash(pip:*)" --allowed-tools "Bash(node:*)" --allowed-tools "Bash(npx:*)" --allowed-tools "WebFetch" --allowed-tools "WebSearch" --allowed-tools "Skill" --allowed-tools "Write(_posts/*)" --allowed-tools "Write(*.js)" --allowed-tools "Write(*.py)" --allowed-tools "Write(*.cjs)" --allowed-tools "Edit(_posts/*)"'

      - name: Create Workflow Summary
        if: always()
        run: |
          echo "## Blog Post Generation Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Status:** ${{ steps.claude.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target URL:** ${{ inputs.target_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.claude.outcome }}" == "success" ]; then
            echo ":white_check_mark: Blog post generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Blog post generation failed" >> $GITHUB_STEP_SUMMARY
          fi
