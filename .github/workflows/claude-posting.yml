name: Claude Posting Workflow

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'The target URL to process'
        required: true
        type: string
      author_opinion:
        description: 'Blog author opinion/thoughts on this topic (optional)'
        required: false
        type: string
      additional_prompt:
        description: 'Any additional prompt instructions'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  create-trending-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Jekyll blog repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Generate Blog Post with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read and follow instructions from: `post-template/url-based-posting.md`

            TARGET_URL: `${{ inputs.target_url }}`
            AUTHOR_OPINION: ${{ inputs.author_opinion }}
            ADDITIONAL_PROMPT: ${{ inputs.additional_prompt }}

            Execute the workflow as specified in the template file.

          claude_args: '--allowed-tools "Bash(./import.sh:*)" --allowed-tools "Bash(git:*)" --allowed-tools "Bash(mkdir:*)" --allowed-tools "Bash(python:*)" --allowed-tools "Bash(python3:*)" --allowed-tools "Bash(pip:*)" --allowed-tools "WebFetch" --allowed-tools "WebSearch" --allowed-tools "Write(_posts/*)" --allowed-tools "Edit(_posts/*)"'
